<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- font awesoms -->
    <link rel="stylesheet" href="file.css/all.css">
      <link rel="stylesheet" href="file.css/css.css">
    <title>project</title>
</head>
<body>
    <div class="d1">
      <div class="d2">
        <div class="tasks-table">
          <div class="d4">
            <h1 class="h1=1">مهامي</h1>
            <button id="add-btn" class="bt-bt1">
              <i class="fa-solid fa-plus"></i>
            </button>
          </div>
          <div id="tasks" class="tasks"></div>
        </div>
      </div>
    </div>
</body>
<script>
let tasks=[
  {
    title:"قراءة الكتاب",
    date:"1/1/2026",
    isDone:false
  },
  {
    title:" إنهاء المشوع النهائي",
    date:"1/1/2026",
    isDone:false
  },
  {
    title:"إنهاء كورس الجافا سكريبت ",
    date:"1/1/2026",
    isDone:false
  },
  {
    title:" حل التحدي",
    date:"1/1/2026",
    isDone:false
  }
];
function getTasksFromStorage(){
  let retrievedTasks = JSON.parse(localStorage.getItem("tasks"));
  tasks= retrievedTasks ?? [];
}
getTasksFromStorage();
function FillTaskOnThePage(){
  document.getElementById("tasks").innerHTML="";
  let index = 0 ;
  for(task of tasks){
    let content= 
    `
    <div class= "task ${task.isDone ? 'done' : ''}">
      <div class= "info">
        <h2 calss="h2-1">${task.title}</h2>
        <div class= "History">
          <i class="fa-solid fa-calendar-days"></i>
          <span> ${task.date} </span>
        </div>
      </div>      
      <div class="action">
        <button onclick="deleteTask(${index})" class="bt-bt2">
          <i class="fa-solid fa-trash"></i>
        </button>
          ${task.isDone
            ? `<button onclick="toggleTaskCompletion(${index})" class="bt bt3 not-done">
                   <i class="fa-solid fa-xmark"></i>
                </button>`
            : `<button onclick="toggleTaskCompletion(${index})" class="bt bt3">
                   <i class="fa-solid fa-check"></i>
                </button>`
        }
            
         <button onclick="editTask(${index})" class="bt bt4">
            <i class="fa-solid fa-pen"></i>
          </button>
     </div>
    </div>
    `;
    document.getElementById("tasks").innerHTML += content;
    index++;
  }
}
FillTaskOnThePage();
document.getElementById("add-btn").addEventListener("click" , function(){
  let now = new Date();
  let date = 
  now.getDate() + 
  "/" +
  (now.getMonth() + 1) +
  "/" +
  now.getFullYear();

  let taskName=prompt("الرجاء إدخال عنوان المهمة");
if(taskName === null || taskName.trim() === ""){
  return;
}

let taskObj = {
  title: taskName.trim(),
  date: date,
  isDone: false
};
tasks.push(taskObj);
storeTasks();
FillTaskOnThePage();
});
function deleteTask(index){
  let task = tasks[index];
  let isConfimed = confirm("هل أنت متأكد من حذف المهمة:" +  task.title);
  if(isConfimed){
    tasks.splice(index , 1);
    storeTasks();
    FillTaskOnThePage();
  } 
}
function editTask(index){
  let task = tasks[index];
  let newTaskTitle=prompt("الرجاء إدخال عنوان المهمة الجديد" , task.title);
  if (newTaskTitle === null || newTaskTitle.trim() === ""){
    return;
  }
  task.title = newTaskTitle.trim();
  storeTasks();
  FillTaskOnThePage();
}
function toggleTaskCompletion(index){
  tasks[index].isDone = !tasks[index].isDone;
  storeTasks();
  FillTaskOnThePage();
}
function storeTasks (){
  localStorage.setItem("tasks", JSON.stringify(tasks));
}
</script>
</html>
